<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit fly video player | CrimConsortium</title>
<meta name="description" content="Play the fruit fly's journey through the criminology citation graph, where open-access papers are corridors and paywalls are walls. Explore the project.">
<meta name="author" content="CrimConsortium">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://fruitfly.crimconsortium.com/player.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme:dark; --bg:#000; --fg:#f0f0f0; --orange:#f68212; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  video { display:block; width:100%; height:100vh; height:100dvh;
          aspect-ratio:16/9; object-fit:contain; background:var(--bg); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
             overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  .project-link:focus { position:absolute; top:8px; left:8px; width:auto; height:auto;
                       margin:0; padding:12px 16px; clip-path:none; overflow:visible;
                       white-space:normal; background:var(--bg); color:var(--orange);
                       outline:2px solid var(--orange); outline-offset:2px; z-index:1; }
</style>
</head>
<body>
<main>
  <h1 class="sr-only" id="player-title">A fruit fly looks for criminology it can read</h1>
  <p class="sr-only" id="player-description">A silent animation of a simulated fruit fly
  exploring criminology papers. Open-access papers are corridors; paywalled papers are walls.
  Use the video controls to play, pause, seek, or enter full screen.</p>
  <a class="sr-only project-link" href="./" target="_blank" rel="noopener">Read the fruitfly project</a>
  <video controls playsinline preload="metadata" width="1280" height="720"
         aria-labelledby="player-title" aria-describedby="player-description">
    <source src="fly.mp4" type="video/mp4">
    Your browser does not support this video. <a href="fly.mp4">Open the MP4 video</a>.
  </video>
</main>
</body>
</html>
