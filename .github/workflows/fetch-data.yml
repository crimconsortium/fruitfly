name: fetch-data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Resolve journals against OpenAlex
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python src/fetch_sources.py

      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: refresh OpenAlex source resolution"
          git push
