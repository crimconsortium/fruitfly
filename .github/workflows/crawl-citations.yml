name: crawl-citations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  citations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require resolved sources
        run: test -f data/sources.csv || (echo "Run the fetch-data workflow first." && exit 1)

      - name: Crawl OA-gated citation closure
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python src/fetch_citations.py

      - name: Commit citation graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations/
          git diff --staged --quiet || git commit -m "data: refresh OA-gated citation closure"
          git push
