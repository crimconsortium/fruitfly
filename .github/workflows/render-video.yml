# Re-render a specific trace. The `go` workflow already does this automatically;
# use this one only when you want a different trace or a different length.

name: render-video

on:
  workflow_dispatch:
    inputs:
      trace:
        description: "Path to the trace JSON, e.g. data/traces/W2141234567.json"
        required: true
      seconds:
        description: "Target video length in seconds"
        required: false
        default: "20"

permissions:
  contents: write
  issues: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the trace exists
        run: test -f "${{ inputs.trace }}" || (echo "No such trace: ${{ inputs.trace }}. Run the go workflow first." && exit 1)

      - name: Render
        run: python src/render.py --trace "${{ inputs.trace }}" --seconds "${{ inputs.seconds }}"

      - name: Commit video and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git diff --staged --quiet || git commit -m "site: re-render fly video"
          git push

      - name: Open an issue if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "render-video failed (run #${{ github.run_number }})" \
            --body "Rendering \`${{ inputs.trace }}\` failed.$(printf '\n\n')Log: $RUN_URL"
