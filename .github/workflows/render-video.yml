name: render-video

on:
  workflow_dispatch:
    inputs:
      trace:
        description: "Path to the trace JSON to render"
        required: true
        default: "data/traces/summary.csv"
      seconds:
        description: "Target video length in seconds"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render
        run: python src/render.py --trace "${{ inputs.trace }}" --seconds "${{ inputs.seconds }}"

      - name: Commit video and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git diff --staged --quiet || git commit -m "site: render fly video"
          git push
