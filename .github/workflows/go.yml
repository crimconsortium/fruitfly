# The only workflow you need. Click Actions -> go -> Run workflow.
#
# Runs tests, then the whole pipeline: resolve journals, crawl the OA-gated citation
# closure, build and calibrate the connectome, run the fly on every seed, pick a
# representative trace, render the video, and write RESULTS.md.
#
# The crawl checkpoints after every seed. If the run dies mid-crawl, just run it again:
# it resumes from data/citations/seeds.partial.json instead of starting over.
#
# On failure: a GitHub issue is opened, and the stale RESULTS.md is NOT republished.

name: go

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the crawl checkpoint and start the crawl over"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

jobs:
  everything:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 0/6 Statistics regression tests
        run: pytest -q tests/

      - name: Free disk space for the 1.1 GB connectome download
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: 1/6 Resolve the Web of Science journal list against OpenAlex
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python src/fetch_sources.py

      - name: 2/6 Crawl the OA-gated citation closure
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          PYTHONPATH: src
        run: |
          if [ "${{ inputs.fresh }}" = "true" ]; then
            python src/fetch_citations.py --fresh
          else
            python src/fetch_citations.py
          fi

      - name: Save the crawl checkpoint even if a later step fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations/ || true
          git diff --staged --quiet || git commit -m "data: crawl progress"
          git pull --rebase --autostash || true
          git push || true

      - name: 3/6 Build the pruned MaleCNS connectome
        run: python src/build_connectome.py

      - name: 4/6 Calibrate, and run the shuffled-connectome controls
        env:
          PYTHONPATH: src
        run: python src/calibrate.py

      - name: 5/6 Run the fly on every seed
        run: python src/engine.py --all

      - name: 6/6 Pick a representative trace and write RESULTS.md
        id: pick
        run: python src/pick_trace.py >> "$GITHUB_OUTPUT"

      - name: Fetch the MaleCNS soma positions for the brain view
        run: python src/fetch_geometry.py

      - name: Record the real spike rasters for the decisions the video shows
        run: PYTHONPATH=src python src/raster.py --trace "${{ steps.pick.outputs.trace }}"

      - name: Render the video
        run: PYTHONPATH=src python src/render.py --trace "${{ steps.pick.outputs.trace }}"

      - name: Render the cartoon cut
        run: PYTHONPATH=src python src/cartoon.py --trace "${{ steps.pick.outputs.trace }}"

      - name: Commit everything
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/ RESULTS.md
          git diff --staged --quiet || git commit -m "run: full pipeline"
          git pull --rebase --autostash || true
          git push

      - name: Put the results in the run summary
        if: success()
        run: cat RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open an issue if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "fruitfly pipeline failed (run #${{ github.run_number }})" \
            --body "The \`go\` workflow failed at the step named in the log. Any RESULTS.md in the repo is from an EARLIER run and was not republished.$(printf '\n\n')The crawl checkpoints after every seed, so re-running resumes rather than restarting.$(printf '\n\n')Log: $RUN_URL"
