name: build-connectome

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connectome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Build pruned connectome
        run: python src/build_connectome.py

      - name: Commit connectome artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/connectome/
          git diff --staged --quiet || git commit -m "data: rebuild pruned MaleCNS v1.0 connectome"
          git push
