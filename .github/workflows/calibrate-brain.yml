name: calibrate-brain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require connectome artifacts
        run: test -f data/connectome/edges.parquet || (echo "Run build-connectome first." && exit 1)

      - name: Calibrate and run shuffled control
        run: python src/calibrate.py
        working-directory: .
        env:
          PYTHONPATH: src

      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calibration.json
          git diff --staged --quiet || git commit -m "data: recalibrate brain and rerun shuffled control"
          git push
