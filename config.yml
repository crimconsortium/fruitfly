# Project configuration. The OA policy here is the single definition used everywhere.

corpus:
  primary: corpus/wos_criminology_penology.txt
  provenance: corpus/PROVENANCE.md

policy:
  # Open access, for this project's purposes.
  open_statuses: [diamond, gold, green, hybrid]
  closed_statuses: [bronze, closed]
  # Reported alongside the headline number as a sensitivity check.
  sensitivity_open_statuses: [diamond, gold, green, hybrid, bronze]
  years: [2015, 2026]
  # Count a repository copy as reachable even when oa_status says otherwise.
  credit_repository_locations: true

resolver:
  min_match_score: 0.92

api:
  max_attempts: 8
  max_backoff_seconds: 120
  # A single failed batch degrades to 'unresolved' and the crawl continues.
  # The run aborts only if this share of batches fails permanently.
  max_failed_batch_share: 0.1

citations:
  n_seeds: 100
  rng_seed: 20260911
  # Stopping rule: run until stuck. The cap below is a compute guard, NOT the rule.
  #
  # It was 300, and 24 of the 25 open seeds hit it, which is why they were censored.
  # 1500 made run #2 too request-heavy to finish; 800 with a shared work cache is the
  # compromise. Crawls that hit the cap are CENSORED, never dropped from seed stats.
  max_nodes_per_seed: 800
  max_depth: 4
  follow: references
  batch_size: 50

connectome:
  dataset: "male-cns:v1.0"
  min_synapses: 5
  hops_upstream_of_readout: 2
  max_neurons: 20000
  max_edges: 3000000
  readout_class_pattern: "descending"
  readout_type_prefix: "DN"
  excitatory: [acetylcholine, ach, dopamine, da, octopamine, oct, serotonin, 5ht, histamine]
  inhibitory: [gaba, glutamate, glu]

calibration:
  # One shuffle is an anecdote. Report a distribution.
  shuffle_replicates: 5
  target_mean_hz: 10.0
  trials: 64
